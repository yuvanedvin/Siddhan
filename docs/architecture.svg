<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-size: 13px; fill: #1f2937; }
      .title { font-size: 19px; font-weight: 700; }
      .subtitle { font-size: 12px; fill: #6b7280; }
      .lbl { font-weight: 600; }
      .small { font-size: 11px; fill: #4b5563; }
      .tiny { font-size: 10px; fill: #6b7280; }
      .region-box { fill: #f9fafb; stroke: #6366f1; stroke-width: 2; stroke-dasharray: 8 4; }
      .vpc-box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
      .pub-subnet { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .priv-subnet { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .service { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
      .task { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.2; }
      .ext-actor { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .ci-actor { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
      .data-flow { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .img-flow { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; marker-end: url(#arrow-blue); }
      .ci-flow { stroke: #7c3aed; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; marker-end: url(#arrow-purple); }
      .logs-flow { stroke: #059669; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Title -->
  <text x="20" y="28" class="title">Containerized web app on AWS — production-shaped architecture</text>
  <text x="20" y="48" class="subtitle">ECS Fargate · Application Load Balancer · ECR · CloudWatch · GitHub Actions CI/CD</text>

  <!-- Legend -->
  <g transform="translate(700,18)">
    <rect x="0" y="0" width="280" height="44" fill="#ffffff" stroke="#d1d5db"/>
    <line x1="10" y1="14" x2="40" y2="14" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="46" y="17" class="tiny">user / API traffic</text>
    <line x1="140" y1="14" x2="170" y2="14" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>
    <text x="176" y="17" class="tiny">image pull</text>
    <line x1="10" y1="32" x2="40" y2="32" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
    <text x="46" y="35" class="tiny">CI/CD deploy</text>
    <line x1="140" y1="32" x2="170" y2="32" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <text x="176" y="35" class="tiny">logs / metrics</text>
  </g>

  <!-- External users -->
  <rect x="20" y="100" width="140" height="60" rx="6" class="ext-actor"/>
  <text x="90" y="125" text-anchor="middle" class="lbl">End users</text>
  <text x="90" y="143" text-anchor="middle" class="small">HTTPS → HTTP</text>

  <!-- GitHub -->
  <rect x="20" y="200" width="140" height="80" rx="6" class="ci-actor"/>
  <text x="90" y="225" text-anchor="middle" class="lbl">GitHub</text>
  <text x="90" y="243" text-anchor="middle" class="small">Actions workflow</text>
  <text x="90" y="259" text-anchor="middle" class="small">OIDC → AWS role</text>
  <text x="90" y="273" text-anchor="middle" class="tiny">no static creds</text>

  <!-- ============== Region box ============== -->
  <rect x="200" y="90" width="780" height="610" rx="10" class="region-box"/>
  <text x="220" y="112" class="lbl" fill="#4338ca">AWS Region — ap-south-2 (Hyderabad)</text>

  <!-- ECR (outside VPC, regional service) -->
  <rect x="780" y="130" width="180" height="64" rx="6" class="service"/>
  <text x="870" y="153" text-anchor="middle" class="lbl">Amazon ECR</text>
  <text x="870" y="171" text-anchor="middle" class="small">private image registry</text>
  <text x="870" y="186" text-anchor="middle" class="tiny">scan-on-push · keep last 10</text>

  <!-- CloudWatch (outside VPC, regional service) -->
  <rect x="780" y="210" width="180" height="78" rx="6" class="service"/>
  <text x="870" y="233" text-anchor="middle" class="lbl">CloudWatch</text>
  <text x="870" y="251" text-anchor="middle" class="small">logs · metrics · alarms</text>
  <text x="870" y="266" text-anchor="middle" class="tiny">Container Insights</text>
  <text x="870" y="280" text-anchor="middle" class="tiny">dashboard + 3 alarms</text>

  <!-- IAM (outside VPC) -->
  <rect x="780" y="304" width="180" height="60" rx="6" class="service"/>
  <text x="870" y="327" text-anchor="middle" class="lbl">IAM roles</text>
  <text x="870" y="345" text-anchor="middle" class="small">execution + task</text>
  <text x="870" y="359" text-anchor="middle" class="tiny">OIDC deploy role</text>

  <!-- ============== VPC ============== -->
  <rect x="220" y="135" width="540" height="540" rx="8" class="vpc-box"/>
  <text x="240" y="157" class="lbl" fill="#1d4ed8">VPC — 10.0.0.0/16</text>

  <!-- IGW -->
  <rect x="240" y="172" width="120" height="40" rx="4" class="service"/>
  <text x="300" y="197" text-anchor="middle">Internet Gateway</text>

  <!-- AZ-a label -->
  <text x="350" y="240" class="tiny" fill="#9ca3af">AZ ap-south-2a</text>
  <text x="610" y="240" class="tiny" fill="#9ca3af">AZ ap-south-2b</text>

  <!-- Public subnet AZ-a -->
  <rect x="240" y="250" width="240" height="120" rx="6" class="pub-subnet"/>
  <text x="252" y="270" class="lbl" fill="#047857">Public subnet</text>
  <text x="252" y="284" class="tiny">10.0.1.0/24</text>

  <!-- Public subnet AZ-b -->
  <rect x="500" y="250" width="240" height="120" rx="6" class="pub-subnet"/>
  <text x="512" y="270" class="lbl" fill="#047857">Public subnet</text>
  <text x="512" y="284" class="tiny">10.0.2.0/24</text>

  <!-- ALB (spanning both AZs visually) -->
  <rect x="290" y="298" width="400" height="58" rx="6" class="service"/>
  <text x="490" y="322" text-anchor="middle" class="lbl">Application Load Balancer</text>
  <text x="490" y="340" text-anchor="middle" class="small">HTTP :80 · health check /health</text>

  <!-- NAT Gateway -->
  <rect x="260" y="385" width="200" height="48" rx="6" class="service"/>
  <text x="360" y="406" text-anchor="middle" class="lbl">NAT Gateway</text>
  <text x="360" y="422" text-anchor="middle" class="tiny">single, AZ-a (cost optimization)</text>

  <!-- Private subnet AZ-a -->
  <rect x="240" y="450" width="240" height="200" rx="6" class="priv-subnet"/>
  <text x="252" y="470" class="lbl" fill="#b91c1c">Private subnet</text>
  <text x="252" y="484" class="tiny">10.0.11.0/24</text>

  <!-- Private subnet AZ-b -->
  <rect x="500" y="450" width="240" height="200" rx="6" class="priv-subnet"/>
  <text x="512" y="470" class="lbl" fill="#b91c1c">Private subnet</text>
  <text x="512" y="484" class="tiny">10.0.12.0/24</text>

  <!-- ECS cluster spanning both private subnets -->
  <rect x="260" y="500" width="460" height="140" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="490" y="520" text-anchor="middle" class="lbl">ECS Fargate cluster — webapp-dev</text>

  <!-- Tasks in AZ-a -->
  <rect x="285" y="535" width="80" height="48" rx="4" class="task"/>
  <text x="325" y="557" text-anchor="middle" class="small">task</text>
  <text x="325" y="572" text-anchor="middle" class="tiny">0.25 vCPU · 512MB</text>
  <rect x="375" y="535" width="80" height="48" rx="4" class="task"/>
  <text x="415" y="557" text-anchor="middle" class="small">task</text>
  <text x="415" y="572" text-anchor="middle" class="tiny">0.25 vCPU · 512MB</text>

  <!-- Tasks in AZ-b -->
  <rect x="525" y="535" width="80" height="48" rx="4" class="task"/>
  <text x="565" y="557" text-anchor="middle" class="small">task</text>
  <text x="565" y="572" text-anchor="middle" class="tiny">0.25 vCPU · 512MB</text>
  <rect x="615" y="535" width="80" height="48" rx="4" class="task"/>
  <text x="655" y="557" text-anchor="middle" class="small">task</text>
  <text x="655" y="572" text-anchor="middle" class="tiny">0.25 vCPU · 512MB</text>

  <!-- Autoscaling label -->
  <text x="490" y="610" text-anchor="middle" class="small">Application Auto Scaling — target tracking @ 60% CPU</text>
  <text x="490" y="625" text-anchor="middle" class="tiny">min 2 · max 6 tasks · rolling deploys</text>

  <!-- ===== Arrows / data flow ===== -->
  <!-- Users -> ALB -->
  <path d="M 160,130 C 280,130 290,260 380,300" class="data-flow"/>
  <!-- ALB -> tasks AZ-a -->
  <path d="M 400,356 L 370,535" class="data-flow"/>
  <!-- ALB -> tasks AZ-b -->
  <path d="M 580,356 L 610,535" class="data-flow"/>

  <!-- Tasks -> NAT egress (out to ECR for image pulls) -->
  <path d="M 415,535 C 380,470 360,440 360,433" class="img-flow"/>
  <!-- NAT -> IGW -->
  <path d="M 360,385 C 360,260 320,220 300,212" class="img-flow"/>
  <!-- IGW -> ECR -->
  <path d="M 360,180 C 540,150 720,155 780,160" class="img-flow"/>

  <!-- Tasks -> CloudWatch logs (via NAT/IGW path conceptually, drawn direct for clarity) -->
  <path d="M 720,560 C 760,400 770,300 780,250" class="logs-flow"/>

  <!-- GitHub -> ECR push -->
  <path d="M 160,225 C 480,180 700,160 780,158" class="ci-flow"/>
  <!-- GitHub -> ECS service update -->
  <path d="M 160,260 C 200,440 250,550 285,558" class="ci-flow"/>
</svg>
